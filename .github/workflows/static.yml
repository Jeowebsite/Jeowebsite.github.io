# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages


on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` if a lockfile is present, else fall back to `npm install`.
        # Lockfile is committed as of the Astro rebuild; this fallback is for
        # forks that strip it out.
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else npm install --no-audit --no-fund
          fi

      - name: Generate games list
        run: node scan.js

      - name: Verify catalog parity
        # Fails the build if any game folder (with an HTML entrypoint) is
        # missing from games_list.json — the silent "game disappears from
        # the grid" class of bug. Orphan partial-import folders are logged
        # but don't fail.
        run: node scripts/verify-catalog-parity.mjs

      - name: Static health scan
        run: node scripts/static-health-scan.js

      - name: Build game_health.json
        run: node scripts/build-game-health.js

      - name: Build offline manifests
        run: node scripts/build-offline-manifest.js --all

      - name: Verify offline manifests (gate)
        # Fails the deploy if any required asset is missing or a new
        # external runtime dep snuck in. New games must be self-contained.
        run: node scripts/verify-offline-manifest.js --missing-manifest-ok

      - name: Guard against broken-count regressions
        # Compare current broken count to the baseline checked into the
        # repo; fail the deploy if it regressed beyond the baseline.
        run: |
          node -e "
            const fs = require('fs');
            const h = JSON.parse(fs.readFileSync('game_health.json','utf-8'));
            const cur = (h.counts && h.counts.broken) || 0;
            let base = { broken_at_main: cur };
            try { base = JSON.parse(fs.readFileSync('qa_baseline.json','utf-8')); } catch {}
            const max = Number(base.broken_at_main) || 0;
            console.log('broken: current=' + cur + ' baseline=' + max);
            if (cur > max) {
              console.error('::error::Broken count regressed from ' + max + ' to ' + cur + '. Refusing to deploy. Run the recovery engine or curate maintenance_overrides.json.');
              process.exit(1);
            }
          "

      # Refresh editorial descriptions + difficulty/duration metadata for any
      # newly-added games. The generator preserves manual=true overrides on
      # re-runs so hand-curated copy survives.
      - name: Refresh game descriptions
        run: node scripts/generate-descriptions.mjs

      # Pre-compute the per-slug similarity matrix. Runs before astro build
      # so the game detail pages can read similar.json instead of doing
      # N-squared work at build time.
      - name: Build similarity matrix
        run: node scripts/build-similarity.mjs

      # Generate .webp siblings for every catalog cover. Resized to 800px
      # max width and quality 78 — typically 60% smaller than the source
      # JPEG/PNG. Idempotent and safe to re-run; existing newer .webps are
      # left alone.
      - name: Convert covers to WebP
        run: node scripts/convert-covers-to-webp.mjs

      # Cutover: Astro is now the canonical deploy artifact. The build
      # writes to ./dist and link-assets --copy stages /Assets, /emulatorjs,
      # /cdn-cgi and the pipeline JSONs into dist so the bundle is fully
      # self-contained (Pages doesn't follow symlinks).
      - name: Build new site (Astro)
        run: npx astro build

      - name: Stage assets into dist
        run: node scripts/link-assets-into-dist.mjs --copy

      - name: Pre-compress static assets
        # Generates .br + .gz siblings for HTML/CSS/JS/SVG/JSON. Pages and
        # Azure SWA serve these natively when Accept-Encoding allows. Skips
        # /Assets, /emulatorjs, /cdn-cgi (vendored game payloads).
        run: node scripts/precompress-dist.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
